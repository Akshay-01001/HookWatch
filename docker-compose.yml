services:
  postgres:
    image: postgres:16-alpine
    container_name: hookwatch-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: hookwatch
      POSTGRES_PASSWORD: hookwatch_dev
      POSTGRES_DB: hookwatch
    volumes:
      - hookwatch_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookwatch -d hookwatch"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: hookwatch-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - hookwatch_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  hookwatch_pgdata:
  hookwatch_redis:
